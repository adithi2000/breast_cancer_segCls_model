name: Base Image Streamlit
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'base_image_creation/Streamlit_/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: setup docker
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: create docker image
              run: |
                echo "Creating Docker image..."
                docker build \
                -t ${{ secrets.DOCKER_USERNAME }}/streamlit_base:latest \
                -f base_image_creation/Streamlit_/Dockerfile .
                echo "Docker image created successfully."

            - name: push docker image
              run: |
                echo "Pushing Docker image to registry..."
                docker push ${{ secrets.DOCKER_USERNAME }}/streamlit_base:latest
                echo "Docker image pushed successfully."
