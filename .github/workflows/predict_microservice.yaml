name: Predict Microservice

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'Predict_Microservice/**'
  # This creates an OR condition between the two workflows
  workflow_run:
    workflows:
      - 'Train Model'
      - 'Base Image Microservice'
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: setup docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: create docker image
        run: |
          echo "Creating Docker image..."
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/predict-microservice:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/predict-microservice:$IMAGE_TAG \
            -f Predict_Microservice/Dockerfile .
          echo "Docker image created successfully."

      - name: push docker image
        run: |
          echo "Pushing Docker image to registry..."
          docker push ${{ secrets.DOCKER_USERNAME }}/predict-microservice:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/predict-microservice:$IMAGE_TAG
          echo "Docker image pushed successfully."
