name: Train Model
on:
    repository_dispatch:
        types: [dvc_updated]
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'data.dvc'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
jobs:
    train_and_test:
        runs-on: ubuntu-latest
        env:
            AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
            EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Validate training environment variables
              run: |
                test -n "$MLFLOW_TRACKING_URI"
                test -n "$EXPERIMENT_NAME"
                test -n "$AWS_ACCESS_KEY_ID"
                test -n "$AWS_SECRET_ACCESS_KEY"
                test -n "$AWS_REGION"
            - name: Install DVC
              run: pip install dvc[s3]
            
            - name: Configure AWS
              uses: aws-actions/configure-aws-credentials@v2
              with:
               aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
               aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
               aws-region: ${{ vars.AWS_REGION }}

            - name: DVC Update
              run: dvc update data.dvc --rev main

            - name: Show DVC file changes
              run: |
                git diff -- data.dvc

            - name: Check DVC update status
              run: |
                dvc status data.dvc

            - name: DVC Pull
              run: dvc pull

            - name: Commit updated dvc files
              if: github.actor != 'github-actions[bot]'
              run: |
                  git config --global user.name "github-actions"
                  git config --global user.email "github-actions@github.com"
                  git add data.dvc
                  git diff --cached --quiet || git commit -m "Update DVC files after pulling data"
                  git pull --rebase
                  git push

            - name: checking the files
              run: |     
                  ls -la
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
              working-directory: src/

            - name: Test training dependencies
              run: |
                python -c "import torch; import monai; import mlflow; import sklearn; import dotenv; print('Training dependencies OK')"
            - name: Check Python syntax
              run: |
                python -m compileall src

            - name: Test source imports
              run: |
                python -c "from modules.model import get_model; from modules.dataset import create_data_list; from modules.engine import train_one_epoch, validation; print('Source imports OK')"
              working-directory: src/
            
            - name: Train the model
              run: |
                  python train.py
              working-directory: src/

            - name: Test the model
              run: |
                    python test.py
              working-directory: src/
