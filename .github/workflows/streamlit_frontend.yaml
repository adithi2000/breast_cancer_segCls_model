name: Frontend Docker Build and Push
on:
    workflow_dispatch:
    push:
        branches:
            - main
        paths:
            - 'streamlit_app/**'
    workflow_run:
        workflows:
          - "Base Image Streamlit"
        types:
            - completed

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
              with:
                ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: setup docker
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: create docker image
              run: |
                echo "Creating Docker image..."
                docker build \
                  -t ${{ secrets.DOCKER_USERNAME }}/streamlit-frontend:latest \
                  -t ${{ secrets.DOCKER_USERNAME }}/streamlit-frontend:$IMAGE_TAG \
                  -f streamlit_app/Dockerfile .
                echo "Docker image created successfully."

            - name: push docker image
              run: |
                echo "Pushing Docker image to registry..."
                docker push ${{ secrets.DOCKER_USERNAME }}/streamlit-frontend:latest
                docker push ${{ secrets.DOCKER_USERNAME }}/streamlit-frontend:$IMAGE_TAG
                echo "Docker image pushed successfully."
