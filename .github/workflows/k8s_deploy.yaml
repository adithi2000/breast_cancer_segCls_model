name: Deploy to minikube
on:
    workflow_dispatch:
    workflow_run:
        workflows:
          - "Predict Microservice"
          - "Frontend Docker Build and Push"
        types:
            - completed

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        defaults:
          run:
            working-directory: ansible
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5
            - name: Install Ansible
              run: |
                sudo apt update
                sudo apt install -y ansible
                sudo apt-get install -y sshpass
            - name: Create Ansible Hosts File
              run: |
                echo "[k8s-node]" > microservices.ini
                echo "${{ secrets.VM_HOST_IP }} ansible_user=${{ secrets.VM_HOST_USER }} ansible_ssh_pass=${{ secrets.VM_HOST_PASSWORD }} ansible_become_password=${{ secrets.VM_HOST_PASSWORD }} ansible_port=${{ secrets.VM_HOST_PORT }} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> microservices.ini
            - name: Verify SSH and sudo access
              run: |
                ansible k8s-node -i microservices.ini -m ansible.builtin.command -a "whoami" --become
            - name: Verify Minikube cluster access
              run: |
                ansible k8s-node -i microservices.ini -m ansible.builtin.command -a "kubectl --kubeconfig=/home/${{ secrets.VM_HOST_USER }}/.kube/config cluster-info"
            - name: Create Ansible extra vars
              env:
                KUBECONFIG_PATH: /home/${{ secrets.VM_HOST_USER }}/.kube/config
                DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
                DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
                GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
                MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
                EXPERIMENT_NAME: ${{ vars.EXPERIMENT_NAME }}
              run: |
                test -n "$GOOGLE_REDIRECT_URI" || {
                  echo "::error::GOOGLE_REDIRECT_URI GitHub Secret is unavailable to this workflow"
                  exit 1
                }

                jq -n \
                  --arg KUBECONFIG "$KUBECONFIG_PATH" \
                  --arg docker_user_name "$DOCKER_USERNAME" \
                  --arg docker_password "$DOCKER_PASSWORD" \
                  --arg AWS_ACCESS_KEY_ID "$AWS_ACCESS_KEY_ID" \
                  --arg AWS_SECRET_ACCESS_KEY "$AWS_SECRET_ACCESS_KEY" \
                  --arg AWS_REGION "$AWS_REGION" \
                  --arg GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID" \
                  --arg GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET" \
                  --arg GOOGLE_REDIRECT_URI "$GOOGLE_REDIRECT_URI" \
                  --arg MLFLOW_TRACKING_URI "$MLFLOW_TRACKING_URI" \
                  --arg EXPERIMENT_NAME "$EXPERIMENT_NAME" \
                  --arg API_URL "predict-service" \
                  '$ARGS.named' > extra-vars.json
                chmod 600 extra-vars.json
            - name: Run Ansible Playbook
              run: |
                ansible-playbook -i microservices.ini deploy.yaml --extra-vars @extra-vars.json
            - name: Remove Ansible extra vars
              if: always()
              run: rm -f extra-vars.json
